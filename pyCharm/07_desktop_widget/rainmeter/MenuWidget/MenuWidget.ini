; =====================================================================
;  MenuWidget — меню на вчера / сегодня / завтра из Google Таблицы
;  Данные (#Day1Title#, #StockURL# и т.д.) пишет Python в @Resources\data.inc
;  Файл сохранён в UTF-16 LE — иначе кириллица не отобразится.
; =====================================================================

[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=MenuWidget
Information=Меню на вчера, сегодня и завтра. Колёсико мыши — прокрутка.

[Variables]
@Include=#@#data.inc

; --- Размеры ---
W=300
HeaderH=36
ViewH=340
FooterH=34
Pad=12
; На сколько пикселей сдвигается текст за один щелчок колёсика
Step=40
; Текущая прокрутка: 0 — самый верх, отрицательная — прокрутили вниз
Scroll=0
; 1 — мышь над областью прокрутки (полоса показывается, только если есть что прокручивать)
ThumbOn=0

; --- Цвета (R,G,B,прозрачность) ---
ColorBg=22,24,30,215
ColorText=230,232,236,255
ColorDim=150,156,168,255
ColorAccent=120,190,255,255
ColorMeal=255,185,70,255
ColorHover=255,255,255,255
ColorThumb=255,255,255,90
Font=Segoe UI

; =====================================================================
;  Измерения (measures) — вычисления, которые не рисуются
; =====================================================================

; Насколько содержимое выше окна просмотра = максимальная прокрутка
[MeasureMaxScroll]
Measure=Calc
Formula=Max([MeterDay3Text:YH] - [MeterDay1Title:Y] + 2 * #Pad# - #ViewH#, 0)
DynamicVariables=1

; При загрузке прокручиваем так, чтобы сверху было «Сегодня».
; Ждём 2-е обновление: на 1-м метры ещё не расставлены.
[MeasureInit]
Measure=Calc
Formula=MeasureInit + 1
IfCondition=MeasureInit = 2
IfTrueAction=[!SetVariable Scroll "(-Min([MeterDay2Title:Y] - [MeterDay1Title:Y], [MeasureMaxScroll]))"][!UpdateMeter *][!Redraw]
DynamicVariables=1

; =====================================================================
;  Стили — общие настройки, которые подключаются к метрам через MeterStyle
; =====================================================================

[StyleText]
FontFace=#Font#
FontSize=9
FontColor=#ColorText#
AntiAlias=1

[StyleDayTitle]
FontSize=10
FontWeight=600
FontColor=#ColorDim#

[StyleDayText]
W=(#W# - 2 * #Pad#)
ClipString=2
; Название приёма пищи («Завтрак:») — полужирным, серым
; и на 1 пункт крупнее блюда (у блюда FontSize=9 из StyleText).
; У сегодняшнего дня цвет переопределён в [MeterDay2Text]
InlineSetting=Weight | 600
InlinePattern=(?m)^[^:]+:
InlineSetting2=Color | #ColorDim#
InlinePattern2=(?m)^[^:]+:
InlineSetting3=Size | 10
InlinePattern3=(?m)^[^:]+:

[StyleButton]
FontColor=#ColorDim#
SolidColor=0,0,0,1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorDim#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; =====================================================================
;  Фон и шапка
; =====================================================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0, 0, #W#, (#HeaderH# + #ViewH# + #FooterH#), 8 | Fill Color #ColorBg# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleButton
X=#Pad#
Y=(#HeaderH# / 2)
StringAlign=LeftCenter
FontSize=11
FontWeight=600
FontColor=#ColorText#
Text=Меню
ToolTipText=Открыть лист «Меню»
LeftMouseUpAction=["#MenuURL#"]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorText#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterUntil]
Meter=String
MeterStyle=StyleText
X=6R
Y=(#HeaderH# / 2)
StringAlign=LeftCenter
FontColor=#ColorDim#
Text=до #MenuUntil#

[MeterRefresh]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#W# - #Pad#)
Y=(#HeaderH# / 2)
StringAlign=RightCenter
FontSize=12
Text=↻
ToolTipText=Обновить из таблицы#CRLF#Последнее обновление: #LastUpdate#
LeftMouseUpAction=["#PythonW#" "#MainScript#"]

; =====================================================================
;  Окно просмотра с прокруткой
;  Container: всё, что выходит за прямоугольник MeterViewport, обрезается
; =====================================================================

[MeterViewport]
Meter=Shape
X=0
Y=#HeaderH#
Shape=Rectangle 0, 0, #W#, #ViewH# | Fill Color 255,255,255,255 | StrokeWidth 0

[MeterDay1Title]
Meter=String
MeterStyle=StyleText | StyleDayTitle
Container=MeterViewport
X=#Pad#
Y=(#Pad# + #Scroll#)
Text=#Day1Title#
DynamicVariables=1

[MeterDay1Text]
Meter=String
MeterStyle=StyleText | StyleDayText
Container=MeterViewport
X=#Pad#
Y=4R
Text=#Day1Text#

[MeterDay2Title]
Meter=String
MeterStyle=StyleText | StyleDayTitle
Container=MeterViewport
X=#Pad#
Y=14R
FontColor=#ColorAccent#
Text=#Day2Title#

[MeterDay2Text]
Meter=String
MeterStyle=StyleText | StyleDayText
Container=MeterViewport
X=#Pad#
Y=4R
; Только у сегодняшнего дня — жёлто-оранжевый (перекрывает цвет из StyleDayText)
InlineSetting2=Color | #ColorMeal#
Text=#Day2Text#

[MeterDay3Title]
Meter=String
MeterStyle=StyleText | StyleDayTitle
Container=MeterViewport
X=#Pad#
Y=14R
Text=#Day3Title#

[MeterDay3Text]
Meter=String
MeterStyle=StyleText | StyleDayText
Container=MeterViewport
X=#Pad#
Y=4R
Text=#Day3Text#

; Невидимый слой поверх текста ловит колёсико мыши и наведение.
; Прозрачность 1, а не 0: полностью прозрачное Rainmeter не «чувствует».
[MeterScrollArea]
Meter=Shape
X=0
Y=#HeaderH#
Shape=Rectangle 0, 0, #W#, #ViewH# | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=[!SetVariable Scroll "(Min(#Scroll# + #Step#, 0))"][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!SetVariable Scroll "(Max(#Scroll# - #Step#, -[MeasureMaxScroll]))"][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetVariable ThumbOn 1][!UpdateMeter MeterThumb][!Redraw]
MouseLeaveAction=[!SetVariable ThumbOn 0][!UpdateMeter MeterThumb][!Redraw]
DynamicVariables=1

; Полоса прокрутки: видна только при наведении.
; Высота ~ доле видимой части, положение ~ текущей прокрутке.
[MeterThumb]
Meter=Shape
X=(#W# - 6)
Y=(#HeaderH# + 3 + (-#Scroll#) / Max([MeasureMaxScroll], 1) * (#ViewH# - 6 - (#ViewH# - 6) * #ViewH# / (#ViewH# + [MeasureMaxScroll])))
Shape=Rectangle 0, 0, 3, ((#ViewH# - 6) * #ViewH# / (#ViewH# + [MeasureMaxScroll])), 1.5 | Fill Color #ColorThumb# | StrokeWidth 0
; Скрыта, если мышь не над областью ИЛИ прокручивать нечего
Hidden=(((#ThumbOn# = 0) + ([MeasureMaxScroll] = 0)) > 0)
DynamicVariables=1

; =====================================================================
;  Нижняя панель: кнопки-ссылки на листы
; =====================================================================

[MeterStock]
Meter=String
MeterStyle=StyleText | StyleButton
X=#Pad#
Y=(#HeaderH# + #ViewH# + #FooterH# / 2)
StringAlign=LeftCenter
Text=Запасы
ToolTipText=Открыть лист «Запасы»
LeftMouseUpAction=["#StockURL#"]

[MeterShopping]
Meter=String
MeterStyle=StyleText | StyleButton
X=16R
Y=(#HeaderH# + #ViewH# + #FooterH# / 2)
StringAlign=LeftCenter
Text=Список продуктов
ToolTipText=Открыть лист «Список продуктов»
LeftMouseUpAction=["#ShoppingURL#"]
