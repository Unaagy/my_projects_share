; =====================================================================
;  CalendarWidget — события Google Календаря на выбранный день
;  Данные (#D7Title#, #D7E1Text# и т.д.) пишет Python в @Resources\data.inc
;  Дни пронумерованы 0…#LastIndex#, сегодня — #TodayIndex#.
;  Файл сохранён в UTF-16 LE — иначе кириллица не отобразится.
; =====================================================================

[Rainmeter]
Update=1000
AccurateText=1

[Metadata]
Name=CalendarWidget
Information=Календарь на день. ‹ › — соседние дни, клик по дате — открыть в Google, колёсико — прокрутка.

[Variables]
@Include=#@#data.inc

; Какой день показан сейчас (номер). При загрузке — сегодня
Index=#TodayIndex#

; --- Размеры ---
W=320
HeaderH=38
ViewH=220
FooterH=32
Pad=12
; Кнопки ‹ › : размер зоны клика
NavW=36
NavH=30
; Ширина колонки со временем
TimeW=78
; Отступ между событиями
RowGap=6
Step=40
Scroll=0
; 1 — мышь над областью прокрутки (полоса показывается, только если есть что прокручивать)
ThumbOn=0

; --- Цвета (R,G,B,прозрачность) ---
ColorBg=22,24,30,215
ColorText=230,232,236,255
ColorDim=150,156,168,255
ColorAccent=120,190,255,255
ColorHover=255,255,255,255
ColorThumb=255,255,255,90
ColorNavHover=255,255,255,28
Font=Segoe UI

; =====================================================================
;  Измерения
; =====================================================================

; Высота содержимого минус высота окна = насколько можно прокрутить
[MeasureMaxScroll]
Measure=Calc
Formula=Max([MeterMore:YH] - [MeterEmpty:Y] + 2 * #Pad# - #ViewH#, 0)
DynamicVariables=1

; =====================================================================
;  Стили
; =====================================================================

[StyleText]
FontFace=#Font#
FontSize=9
FontColor=#ColorText#
AntiAlias=1

[StyleButton]
FontColor=#ColorDim#
SolidColor=0,0,0,1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorDim#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; Строки событий (Container и DynamicVariables прописаны в самих метрах)
[StyleRowTime]
X=(#Pad# + 10)
FontColor=#ColorDim#

[StyleRowText]
X=(#Pad# + 10 + #TimeW#)
W=(#W# - 2 * #Pad# - 10 - #TimeW# - 6)
ClipString=2

[StyleRowBar]
X=#Pad#

; =====================================================================
;  Фон и шапка: ‹  дата  ›
; =====================================================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0, 0, #W#, (#HeaderH# + #ViewH# + #FooterH#), 8 | Fill Color #ColorBg# | StrokeWidth 0

; Смена дня: меняем Index, сбрасываем прокрутку, перерисовываем всё
[MeterPrev]
Meter=String
MeterStyle=StyleText | StyleButton
; Зона клика NavW×NavH вокруг символа: X и Y — её центр (StringAlign=CenterCenter)
X=(#Pad# - 4 + #NavW# / 2)
Y=(#HeaderH# / 2)
W=#NavW#
H=#NavH#
StringAlign=CenterCenter
FontSize=18
ToolTipText=Предыдущий день
Text=‹
; При наведении — светлее символ и лёгкая подсветка всей зоны клика
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorHover#"][!SetOption #CURRENTSECTION# SolidColor "#ColorNavHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorDim#"][!SetOption #CURRENTSECTION# SolidColor "0,0,0,1"][!UpdateMeter #CURRENTSECTION#][!Redraw]
; Срабатывает при нажатии (а не отпускании); двойной клик — то же действие
LeftMouseDownAction=[!SetVariable Index "(Max(#Index# - 1, 0))"][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
LeftMouseDoubleClickAction=[!SetVariable Index "(Max(#Index# - 1, 0))"][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
; Без этого #Index# в действиях подставится один раз при загрузке
; и кнопка будет каждый раз ставить один и тот же день
DynamicVariables=1

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#W# / 2)
Y=(#HeaderH# / 2)
StringAlign=CenterCenter
FontSize=10
FontWeight=600
FontColor=#ColorText#
Text=[#D[#Index]Title]
ToolTipText=Открыть этот день в Google Календаре
LeftMouseUpAction=["[#D[#Index]URL]"]
DynamicVariables=1
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorText#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[MeterNext]
Meter=String
MeterStyle=StyleText | StyleButton
; Зона клика NavW×NavH вокруг символа: X и Y — её центр (StringAlign=CenterCenter)
X=(#W# - #Pad# + 4 - #NavW# / 2)
Y=(#HeaderH# / 2)
W=#NavW#
H=#NavH#
StringAlign=CenterCenter
FontSize=18
ToolTipText=Следующий день
Text=›
; При наведении — светлее символ и лёгкая подсветка всей зоны клика
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorHover#"][!SetOption #CURRENTSECTION# SolidColor "#ColorNavHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorDim#"][!SetOption #CURRENTSECTION# SolidColor "0,0,0,1"][!UpdateMeter #CURRENTSECTION#][!Redraw]
; Срабатывает при нажатии (а не отпускании); двойной клик — то же действие
LeftMouseDownAction=[!SetVariable Index "(Min(#Index# + 1, #LastIndex#))"][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
LeftMouseDoubleClickAction=[!SetVariable Index "(Min(#Index# + 1, #LastIndex#))"][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
; Без этого #Index# в действиях подставится один раз при загрузке
; и кнопка будет каждый раз ставить один и тот же день
DynamicVariables=1

[MeterViewport]
Meter=Shape
X=0
Y=#HeaderH#
Shape=Rectangle 0, 0, #W#, #ViewH# | Fill Color 255,255,255,255 | StrokeWidth 0

; «Событий нет» — виден, только если в дне 0 событий.
; Он же — точка отсчёта для прокрутки (Y зависит от #Scroll#)
[MeterEmpty]
Meter=String
MeterStyle=StyleText
Container=MeterViewport
X=#Pad#
Y=(#Pad# + #Scroll#)
FontColor=#ColorDim#
Text=Событий нет
Hidden=([#D[#Index]Count] > 0)
DynamicVariables=1

; ---------------------------------------------------------------------
;  Строки событий 1…15. Каждая — три метра: время, название, цветная полоска.
;  Лишние строки скрыты (Hidden), а у скрытого метра высота 0 —
;  поэтому они не оставляют пустого места.
; ---------------------------------------------------------------------

[MeterTime1]
Meter=String
MeterStyle=StyleText | StyleRowTime
Y=(([#D[#Index]Count] < 1) ? 0 : 0)R
Text=[#D[#Index]E1Time]
Hidden=([#D[#Index]Count] < 1)
Container=MeterViewport
DynamicVariables=1

[MeterText1]
Meter=String
MeterStyle=StyleText | StyleRowText
Y=0r
Text=[#D[#Index]E1Text]
Hidden=([#D[#Index]Count] < 1)
Container=MeterViewport
DynamicVariables=1

[MeterBar1]
Meter=Shape
MeterStyle=StyleRowBar
Y=0r
Shape=Rectangle 0, 0, 3, [MeterText1:H], 1.5 | Fill Color [#D[#Index]E1Color] | StrokeWidth 0
Hidden=([#D[#Index]Count] < 1)
Container=MeterViewport
DynamicVariables=1

[MeterTime2]
Meter=String
MeterStyle=StyleText | StyleRowTime
