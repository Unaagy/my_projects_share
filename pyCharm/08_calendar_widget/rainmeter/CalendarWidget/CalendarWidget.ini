; «+ ещё N», если событий больше 15
[MeterMore]
Meter=String
MeterStyle=StyleText
Container=MeterViewport
X=(#Pad# + 10)
Y=(([#D[#Index]HasMore] = 0) ? 0 : #RowGap#)R
FontColor=#ColorDim#
Text=[#D[#Index]More]
Hidden=([#D[#Index]HasMore] = 0)
DynamicVariables=1

; Невидимый слой поверх событий: ловит колёсико и наведение.
; Прозрачность 1, а не 0: полностью прозрачное Rainmeter не «чувствует».
[MeterScrollArea]
Meter=Shape
X=0
Y=#HeaderH#
Shape=Rectangle 0, 0, #W#, #ViewH# | Fill Color 0,0,0,1 | StrokeWidth 0
MouseScrollUpAction=[!SetVariable Scroll "(Min(#Scroll# + #Step#, 0))"][!UpdateMeter *][!Redraw]
MouseScrollDownAction=[!SetVariable Scroll "(Max(#Scroll# - #Step#, -[MeasureMaxScroll]))"][!UpdateMeter *][!Redraw]
MouseOverAction=[!SetVariable ThumbOn 1][!UpdateMeter MeterThumb][!Redraw]
MouseLeaveAction=[!SetVariable ThumbOn 0][!UpdateMeter MeterThumb][!Redraw]
DynamicVariables=1

; Полоса прокрутки: видна при наведении, только если есть что прокручивать
[MeterThumb]
Meter=Shape
X=(#W# - 6)
Y=(#HeaderH# + 3 + (-#Scroll#) / Max([MeasureMaxScroll], 1) * (#ViewH# - 6 - (#ViewH# - 6) * #ViewH# / (#ViewH# + [MeasureMaxScroll])))
Shape=Rectangle 0, 0, 3, ((#ViewH# - 6) * #ViewH# / (#ViewH# + [MeasureMaxScroll])), 1.5 | Fill Color #ColorThumb# | StrokeWidth 0
; Скрыта, если мышь не над областью ИЛИ прокручивать нечего
Hidden=(((#ThumbOn# = 0) + ([MeasureMaxScroll] = 0)) > 0)
DynamicVariables=1

; =====================================================================
;  Подвал: «Сегодня» и обновление
; =====================================================================

[MeterToday]
Meter=String
MeterStyle=StyleText | StyleButton
X=#Pad#
Y=(#HeaderH# + #ViewH# + #FooterH# / 2)
StringAlign=LeftCenter
Text=Сегодня
ToolTipText=Вернуться к сегодняшнему дню
; Срабатывает при нажатии (а не отпускании) — без задержки на проверку перетаскивания.
; Двойной клик — то же действие, чтобы быстрые повторные нажатия не терялись.
LeftMouseDownAction=[!SetVariable Index #TodayIndex#][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
LeftMouseDoubleClickAction=[!SetVariable Index #TodayIndex#][!SetVariable Scroll 0][!UpdateMeasure *][!UpdateMeter *][!Redraw]
; Без этого #Index# в действиях подставится один раз при загрузке
; и кнопка будет каждый раз ставить один и тот же день
DynamicVariables=1

[MeterRefresh]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#W# - #Pad#)
Y=(#HeaderH# + #ViewH# + #FooterH# / 2)
StringAlign=RightCenter
FontSize=12
Text=↻
ToolTipText=Обновить из Google Календаря#CRLF#Последнее обновление: #LastUpdate#
LeftMouseUpAction=["#PythonW#" "#MainScript#"]
