FontSize=10
Text=[#Deck7Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "7"]
Hidden=((#MenuOpen# = 0) + (7 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu8]
