StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck10Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "10"]
Hidden=((#MenuOpen# = 0) + (10 > #DeckCount#) > 0)
DynamicVariables=1
