; =====================================================================
;  FlashcardsWidget — карточки для запоминания (слова, термины)
;  Данные пишет Python в @Resources\data.inc:
;    Deck<n>Name/Total/URL — колоды; CurrentDeck — текущая;
;    Q<k>Id/Front/Back, QLen — очередь на сегодня; P<k>…, PLen — «пройти ещё раз»;
;    TodayKnown / TodayUnknown — «Знаю» / «Не знаю» за сегодня в текущей колоде.
;  Файл сохранён в UTF-16 LE — иначе кириллица не отобразится.
; =====================================================================

[Rainmeter]
Update=1000
AccurateText=1
; Высота окна подстраивается под длину слова и перевода
DynamicWindowSize=1

[Metadata]
Name=FlashcardsWidget
Information=Карточки: «показать ответ» — просто подсмотреть; «✓ Знаю» — интервал 1→3→7→30 дней, «✗ Не знаю» — повтор завтра.

[Variables]
@Include=#@#data.inc

; --- Состояние (меняется кнопками, сбрасывается при обновлении скина) ---
; Номер карточки в очереди
Pos=1
; 0 — очередь на сегодня (Q), 1 — «пройти ещё раз» (P)
Mode=0
; Какую очередь показывать: Q или P (часть имени переменной)
Pfx=Q
; 1 — ответ открыт
Revealed=0
; 1 — открыт выпадающий список колод
MenuOpen=0
; Время последнего действия (секунды) — для таймера смены карточки
LastAction=0

; --- Таймер: смена карточки каждые N минут ---
CardMinutes=60

; --- Размеры ---
W=340
Pad=14
HeaderH=50
FooterH=46
BtnW=104
BtnH=30
MenuItemH=26

; --- Цвета (R,G,B,прозрачность) ---
ColorBg=22,24,30,215
ColorText=230,232,236,255
ColorDim=150,156,168,255
ColorAccent=120,190,255,255
; Вопрос на карточке — чтобы взгляд сразу падал на него
ColorQuestion=255,165,60,255
; Кнопки «Знаю» и «Не знаю»
ColorKnow=110,200,120,255
ColorDontKnow=235,110,110,255
ColorHover=255,255,255,255
ColorLine=255,255,255,30
ColorBtn=255,255,255,18
ColorBtnHover=255,255,255,40
ColorMenuBg=34,37,46,255
Font=Segoe UI

; =====================================================================
;  Измерения
; =====================================================================

; Текущее время в секундах — для таймера
[MeasureNow]
Measure=Time

; Первое обновление: запоминаем время запуска как «последнее действие»
[MeasureInit]
Measure=Calc
Formula=MeasureInit + 1
IfCondition=MeasureInit = 1
IfTrueAction=[!SetVariable LastAction [MeasureNow:]]
DynamicVariables=1

; Таймер: прошло CardMinutes без действий — следующая карточка (если карточки ещё есть)
[MeasureTimer]
Measure=Calc
Formula=([MeasureNow:] - #LastAction#) >= #CardMinutes# * 60
IfCondition=(MeasureTimer = 1) && (#Pos# <= [#[#Pfx]Len]) && (#LastAction# > 0)
IfTrueAction=[!SetVariable Pos "(#Pos# + 1)"][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
DynamicVariables=1

; Очередь на сегодня закончилась (а была не пустой) — пересобрать её без интернета:
; вдруг остались карточки, пропущенные таймером. --settle: подождать запись последнего ответа
[MeasureQueueEnd]
Measure=Calc
Formula=(#Mode# = 0) * (#Pos# > [#QLen]) * ([#QLen] > 0)
IfCondition=MeasureQueueEnd = 1
IfTrueAction=["#PythonW#" "#MainScript#" "--local" "--settle" "--deck" "#CurrentDeck#"]
DynamicVariables=1

; =====================================================================
;  Стили
; =====================================================================

[StyleText]
FontFace=#Font#
FontSize=9
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1

[StyleLink]
FontColor=#ColorDim#
SolidColor=0,0,0,1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "#ColorHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorDim#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; Кнопка с подложкой: зона клика BtnW×BtnH, X и Y — центр
[StyleButton]
W=#BtnW#
H=#BtnH#
StringAlign=CenterCenter
FontSize=10
FontWeight=600
SolidColor=#ColorBtn#
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "#ColorBtnHover#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "#ColorBtn#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; =====================================================================
;  Фон (высота — по нижней панели, которая стоит под содержимым)
; =====================================================================

[MeterBackground]
Meter=Shape
Shape=Rectangle 0, 0, #W#, ([MeterFooterLine:Y] + #FooterH#), 8 | Fill Color #ColorBg# | StrokeWidth 0
DynamicVariables=1

; =====================================================================
;  Шапка: колода ▾ слева, «Всего» и «Сегодня» справа
; =====================================================================

[MeterDeck]
Meter=String
MeterStyle=StyleText | StyleLink
X=#Pad#
Y=(#HeaderH# / 2)
StringAlign=LeftCenter
FontSize=11
FontWeight=600
FontColor=#ColorText#
W=(#W# - 2 * #Pad# - 100)
ClipString=1
Text=[#Deck[#CurrentDeck]Name]  ▾
ToolTipText=Выбрать колоду
LeftMouseDownAction=[!SetVariable MenuOpen "(1 - #MenuOpen#)"][!UpdateMeter *][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorText#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
DynamicVariables=1

[MeterTotal]
Meter=String
MeterStyle=StyleText
X=(#W# - #Pad#)
Y=10
StringAlign=Right
FontColor=#ColorDim#
Text=Всего: [#Deck[#CurrentDeck]Total]
DynamicVariables=1

[MeterToday]
Meter=String
MeterStyle=StyleText
X=(#W# - #Pad#)
Y=2R
StringAlign=Right
FontColor=#ColorDim#
Text=Сегодня: ✓ #TodayKnown#  ✗ #TodayUnknown#
; ✓ с числом — зелёным, ✗ с числом — красным
InlineSetting=Color | #ColorKnow#
InlinePattern=✓ \d+
InlineSetting2=Color | #ColorDontKnow#
InlinePattern2=✗ \d+
DynamicVariables=1

[MeterHeaderLine]
Meter=Shape
Shape=Rectangle #Pad#, #HeaderH#, (#W# - 2 * #Pad#), 1 | Fill Color #ColorLine# | StrokeWidth 0

; =====================================================================
;  Карточка (видна, пока в очереди есть карточки: Pos ≤ длины очереди)
; =====================================================================

; Вопрос
DynamicVariables=1

[MeterFront]
Meter=String
MeterStyle=StyleText
X=(#W# / 2)
Y=(#HeaderH# + 22)
W=(#W# - 2 * #Pad#)
StringAlign=Center
ClipString=2
; Размер — из data.inc: 16 / 14 / 12 в зависимости от длины текста
FontSize=[#[#Pfx][#Pos]Size]
FontWeight=600
FontColor=#ColorQuestion#
Text=[#[#Pfx][#Pos]Front]
Hidden=(#Pos# > [#[#Pfx]Len])

; «Показать ответ»: две кнопки на одном месте — для обычного режима (с записью
; «повтор завтра») и для тренировки (без записи). Видна та, что подходит к Mode.
DynamicVariables=1

; «Показать ответ» — просто подсмотреть: ничего не записывает, оценку ставят кнопки внизу
[MeterReveal]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#W# / 2)
Y=([MeterFront:YH] + 34)
W=(#W# - 2 * #Pad#)
H=40
StringAlign=CenterCenter
FontSize=10
Text=( показать ответ )
LeftMouseDownAction=[!SetVariable Revealed 1][!SetVariable LastAction [MeasureNow:]][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Revealed# = 1) > 0)
DynamicVariables=1

[MeterSep]
Meter=Shape
Y=([MeterFront:YH] + 14)
Shape=Rectangle (#W# / 2 - 60), 0, 120, 1 | Fill Color #ColorLine# | StrokeWidth 0
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Revealed# = 0) > 0)
DynamicVariables=1

[MeterBack]
Meter=String
MeterStyle=StyleText
X=(#W# / 2)
Y=([MeterFront:YH] + 26)
W=(#W# - 2 * #Pad#)
StringAlign=Center
ClipString=2
FontSize=11
FontColor=#ColorAccent#
Text=[#[#Pfx][#Pos]Back]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Revealed# = 0) > 0)

; =====================================================================
;  Конец очереди
; =====================================================================
DynamicVariables=1

[MeterEndMsg]
Meter=String
MeterStyle=StyleText
X=(#W# / 2)
Y=(#HeaderH# + 26)
W=(#W# - 2 * #Pad#)
StringAlign=Center
ClipString=2
FontSize=12
; Эмодзи выходит одноцветным — подкрашиваем значок золотым
InlineSetting=Color | 255,200,80,255
InlinePattern=🎉
InlineSetting2=Color | #ColorKnow#
InlinePattern2=✓ \d+
InlineSetting3=Color | #ColorDontKnow#
InlinePattern3=✗ \d+
Text=На сегодня всё 🎉 · ✓ #TodayKnown#  ✗ #TodayUnknown#
Hidden=((#Pos# <= [#[#Pfx]Len]) + (#Mode# = 1) + ([#Deck[#CurrentDeck]Total] = 0) > 0)
DynamicVariables=1

[MeterEndPractice]
Meter=String
MeterStyle=StyleText
X=(#W# / 2)
Y=(#HeaderH# + 26)
W=(#W# - 2 * #Pad#)
StringAlign=Center
ClipString=2
FontSize=12
; Эмодзи выходит одноцветным — подкрашиваем значок золотым
InlineSetting=Color | 255,200,80,255
InlinePattern=🎉
Text=Колода пройдена 🎉
Hidden=((#Pos# <= [#[#Pfx]Len]) + (#Mode# = 0) > 0)
DynamicVariables=1

[MeterEmptyDeck]
Meter=String
MeterStyle=StyleText
X=(#W# / 2)
Y=(#HeaderH# + 26)
W=(#W# - 2 * #Pad#)
StringAlign=Center
ClipString=2
FontSize=11
FontColor=#ColorDim#
Text=В колоде пока нет карточек#CRLF#нажмите «+», чтобы добавить
Hidden=([#Deck[#CurrentDeck]Total] > 0)

; «Пройти ещё раз»: вся колода в случайном порядке, без влияния на интервалы
DynamicVariables=1

[MeterPractice]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#W# / 2)
Y=(#HeaderH# + 88)
W=150
Text=Пройти ещё раз
ToolTipText=Вся колода в случайном порядке — для тренировки, интервалы не меняются
LeftMouseDownAction=[!SetVariable Mode 1][!SetVariable Pfx P][!SetVariable Pos 1][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# <= [#[#Pfx]Len]) + ([#Deck[#CurrentDeck]Total] = 0) > 0)
DynamicVariables=1

; =====================================================================
;  Нижняя панель: «Знаю» / «Дальше» по центру, «+» и «↻» справа.
;  Линия стоит под самым нижним видимым элементом.
; =====================================================================

[MeterFooterLine]
Meter=Shape
Y=(Max(Max([MeterFront:YH] + 64, [MeterBack:YH] + 20), #HeaderH# + 120) * (#Pos# <= [#[#Pfx]Len]) + (#HeaderH# + 120) * (#Pos# > [#[#Pfx]Len]))
Shape=Rectangle #Pad#, 0, (#W# - 2 * #Pad#), 1 | Fill Color #ColorLine# | StrokeWidth 0
DynamicVariables=1

; «✓ Знаю»: интервал на ступень выше, +1 к «✓», следующая карточка
[MeterKnow]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#Pad# + #BtnW# * 1.5 + 8)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
FontColor=#ColorKnow#
Text=✓ Знаю
LeftMouseDownAction=["#PythonW#" "#AnswerScript#" "know" "#CurrentDeck#" "[#Q[#Pos]Id]"][!SetVariable TodayKnown "(#TodayKnown# + 1)"][!SetVariable Pos "(#Pos# + 1)"][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Mode# = 1) > 0)
DynamicVariables=1

; «✗ Не знаю»: повтор завтра с начала, +1 к «✗», следующая карточка
[MeterDontKnow]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#Pad# + #BtnW# / 2)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
FontColor=#ColorDontKnow#
Text=✗ Не знаю
LeftMouseDownAction=["#PythonW#" "#AnswerScript#" "again" "#CurrentDeck#" "[#Q[#Pos]Id]"][!SetVariable TodayUnknown "(#TodayUnknown# + 1)"][!SetVariable Pos "(#Pos# + 1)"][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Mode# = 1) > 0)
DynamicVariables=1

; В тренировке («Пройти ещё раз») обе кнопки просто листают
[MeterKnowPractice]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#Pad# + #BtnW# * 1.5 + 8)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
FontColor=#ColorKnow#
Text=✓ Знаю
LeftMouseDownAction=[!SetVariable Pos "(#Pos# + 1)"][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Mode# = 0) > 0)
DynamicVariables=1

[MeterDontKnowPractice]
Meter=String
MeterStyle=StyleText | StyleButton
X=(#Pad# + #BtnW# / 2)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
FontColor=#ColorDontKnow#
Text=✗ Не знаю
LeftMouseDownAction=[!SetVariable Pos "(#Pos# + 1)"][!SetVariable Revealed 0][!SetVariable LastAction [MeasureNow:]][!UpdateMeasure *][!UpdateMeter *][!UpdateMeter *][!Redraw]
Hidden=((#Pos# > [#[#Pfx]Len]) + (#Mode# = 0) > 0)
DynamicVariables=1

[MeterRefresh]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#W# - #Pad#)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
W=28
H=28
StringAlign=RightCenter
FontSize=13
Text=↻
ToolTipText=Загрузить свежие карточки из таблицы (прогресс сохранится)
LeftMouseUpAction=["#PythonW#" "#MainScript#" "--deck" "#CurrentDeck#"]
DynamicVariables=1

[MeterAdd]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#W# - #Pad# - 32)
Y=([MeterFooterLine:Y] + #FooterH# / 2)
W=28
H=28
StringAlign=RightCenter
FontSize=15
Text=+
ToolTipText=Открыть таблицу: добавить или изменить карточки
LeftMouseUpAction=["[#Deck[#CurrentDeck]URL]"]

; =====================================================================
;  Выпадающий список колод (поверх всего — поэтому в конце файла)
; =====================================================================

; Подложка ловит клики, чтобы они не попадали в карточку под списком
DynamicVariables=1

[MeterMenuBg]
Meter=Shape
X=(#Pad# - 6)
Y=(#HeaderH# - 4)
Shape=Rectangle 0, 0, 220, (#DeckCount# * #MenuItemH# + 8), 6 | Fill Color #ColorMenuBg# | StrokeWidth 1 | StrokeColor #ColorLine#
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]
Hidden=(#MenuOpen# = 0)
DynamicVariables=1

[MeterMenu1]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 0 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck1Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "1"]
Hidden=((#MenuOpen# = 0) + (1 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu2]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 1 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck2Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "2"]
Hidden=((#MenuOpen# = 0) + (2 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu3]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 2 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck3Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "3"]
Hidden=((#MenuOpen# = 0) + (3 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu4]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 3 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck4Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "4"]
Hidden=((#MenuOpen# = 0) + (4 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu5]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 4 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck5Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "5"]
Hidden=((#MenuOpen# = 0) + (5 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu6]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 5 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck6Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "6"]
Hidden=((#MenuOpen# = 0) + (6 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu7]
