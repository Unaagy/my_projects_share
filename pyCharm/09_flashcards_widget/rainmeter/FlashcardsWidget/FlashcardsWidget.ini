; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck8Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "8"]
Hidden=((#MenuOpen# = 0) + (8 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu9]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 8 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
H=#MenuItemH#
StringAlign=LeftCenter
Padding=10,0,0,0
FontSize=10
Text=[#Deck9Name]
LeftMouseDownAction=[!SetVariable MenuOpen 0][!UpdateMeter *][!Redraw]["#PythonW#" "#MainScript#" "--local" "--deck" "9"]
Hidden=((#MenuOpen# = 0) + (9 > #DeckCount#) > 0)
DynamicVariables=1

[MeterMenu10]
Meter=String
MeterStyle=StyleText | StyleLink
X=(#Pad# - 6)
Y=(#HeaderH# + (#MenuItemH# * 9 + 0.5))
; Padding прибавляется к ширине: 210 + 10 = 220, как у подложки
W=210
